name: bond Unity
on:
  workflow_dispatch:
    inputs:
      bond_ref:
        description: bond commit or branch to compile and test in Unity
        required: true
        default: main
concurrency:
  group: bond-unity-${{ inputs.bond_ref }}
  cancel-in-progress: true
jobs:
  unity:
    name: bond Unity compile, EditMode and PlayMode tests
    runs-on: [self-hosted, unity]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          repository: IAFahim/bond
          ref: ${{ inputs.bond_ref }}
          path: bond
      - name: Unity steps (bond's eng/unity-ci.sh, its own probe project)
        env:
          BOND_UNITY_OUT: ${{ github.workspace }}/artifacts/bond-unity
        run: bash bond/eng/unity-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bond-unity-logs
          path: artifacts/bond-unity
