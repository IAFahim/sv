name: determinism

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cross-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            isa: default
          - os: ubuntu-latest
            isa: no-avx2
            env: DOTNET_EnableAVX2=0
          - os: ubuntu-latest
            isa: scalar
            env: DOTNET_EnableHWIntrinsic=0
          - os: ubuntu-24.04-arm
            isa: default
          - os: macos-latest
            isa: default
          - os: windows-latest
            isa: default
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.isa }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: sv

      - uses: actions/checkout@v5
        with:
          repository: IAFahim/tl
          ref: 3ba5575e3a87bb8db47ca13ec6faa9b2b5f87a35
          path: tl

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cross-host digests + full suite
        shell: bash
        working-directory: sv
        run: |
          if [ -n "${{ matrix.env }}" ]; then export ${{ matrix.env }}; fi
          dotnet test sv.slnx -c Release --logger "console;verbosity=normal"
          dotnet test sv.slnx -c Release -p:SvChecked=true

      - name: README chapter 1 and v4 hello samples print the documented numbers
        shell: bash
        working-directory: sv
        run: |
          if [ -n "${{ matrix.env }}" ]; then export ${{ matrix.env }}; fi
          dotnet build sv.slnx -c Release -v q
          dotnet run --no-build -c Release --project samples/Sv.Hello > hello.txt
          diff -u --strip-trailing-cr samples/Sv.Hello/expected.txt hello.txt
          dotnet run --no-build -c Release --project samples/Sv.Columns.Hello > columns-hello.txt
          diff -u --strip-trailing-cr samples/Sv.Columns.Hello/expected.txt columns-hello.txt
