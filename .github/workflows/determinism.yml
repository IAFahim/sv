name: determinism

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cross-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            isa: default
          - os: ubuntu-latest
            isa: no-avx2
            env: DOTNET_EnableAVX2=0
          - os: ubuntu-latest
            isa: scalar
            env: DOTNET_EnableHWIntrinsic=0
          - os: ubuntu-24.04-arm
            isa: default
          - os: macos-latest
            isa: default
          - os: windows-latest
            isa: default
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.isa }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          path: sv

      - uses: actions/checkout@v5
        with:
          repository: IAFahim/tl
          ref: d87d1998985e2abdb68dbcfc6b3f7a270c7e0a5d
          path: tl

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Cross-host digests + full suite
        shell: bash
        working-directory: sv
        run: |
          if [ -n "${{ matrix.env }}" ]; then export ${{ matrix.env }}; fi
          dotnet test sv.slnx -c Release --logger "console;verbosity=normal"
          dotnet test sv.slnx -c Release -p:SvChecked=true

      - name: README chapter 1 sample prints the documented numbers
        shell: bash
        working-directory: sv
        run: |
          if [ -n "${{ matrix.env }}" ]; then export ${{ matrix.env }}; fi
          dotnet build sv.slnx -c Release -v q
          dotnet run --no-build -c Release --project samples/Sv.Hello > hello.txt
          diff -u --strip-trailing-cr samples/Sv.Hello/expected.txt hello.txt
