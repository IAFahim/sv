name: determinism

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  cross-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            isa: default
          - os: ubuntu-latest
            isa: no-avx2
            env: DOTNET_EnableAVX2=0
          - os: ubuntu-latest
            isa: scalar
            env: DOTNET_EnableHWIntrinsic=0
          - os: ubuntu-24.04-arm
            isa: default
          - os: macos-latest
            isa: default
          - os: windows-latest
            isa: default
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} / ${{ matrix.isa }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Baked cross-host digest + full suite
        shell: bash
        run: |
          if [ -n "${{ matrix.env }}" ]; then export ${{ matrix.env }}; fi
          dotnet test sv.slnx -c Release --logger "console;verbosity=normal"
          dotnet test sv.slnx -c Release -p:DefineConstants=SV_CHECKED
