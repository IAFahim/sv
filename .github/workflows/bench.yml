name: bench

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bench-readme
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  readme-numbers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run the suite and refresh README
        run: bash .github/scripts/bench-readme.sh

      - name: Test suite must stay green too
        run: dotnet test sv.slnx -c Release

      - name: Commit refreshed numbers
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "sv-bench-bot"
            git config user.email "actions@users.noreply.github.com"
            git add README.md
            git commit -m "bench: refresh README numbers [skip ci]"
            git push
          else
            echo "numbers unchanged (within table precision) — nothing to commit"
          fi
